name: Android pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.5.1
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[viewer]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/templates/*.apk "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
      - name: Restore temporary debug identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sceneforge-debug-identity-v1
      - name: Configure export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(Path.home()/".android/debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }.items():
              text += f'{key}="{value}"\n'
          (Path.home()/".config/godot/editor_settings-4.5.tres").write_text(text)
          p = Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("version/code=1", 'version/code='+os.environ["GITHUB_RUN_NUMBER"]))
          PY
      - name: Restore generated scenery
        id: scenery
        uses: actions/cache@v4
        with:
          path: |
            game/assets
            build/NeonFoundry-preview.png
            build/NeonFoundry.blend
            build/asset-report.json
            build/fleet-report.json
          key: foundry-blender-4.5.3-${{ hashFiles('tools/build_neon_foundry.py', 'tools/kestrel_detail.py', 'tools/build_fleet.py', 'tools/piledriver_detail.py', 'tools/forge_detail.py', 'tools/shrike_smooth.py') }}
      - name: Build original Blender scenery
        if: steps.scenery.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.3-linux-x64/blender --background --threads 4 --python tools/build_neon_foundry.py
          /tmp/blender-4.5.3-linux-x64/blender --background --threads 4 --python tools/build_fleet.py
          test -s game/assets/fleet/aurora.glb
          test -s build/fleet-report.json
          test -s game/assets/neon_foundry.glb
          test -s build/NeonFoundry-preview.png
      - name: Cache generated assets before runtime checks
        if: steps.scenery.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            game/assets
            build/NeonFoundry-preview.png
            build/NeonFoundry.blend
            build/asset-report.json
            build/fleet-report.json
          key: foundry-blender-4.5.3-${{ hashFiles('tools/build_neon_foundry.py', 'tools/kestrel_detail.py', 'tools/build_fleet.py', 'tools/piledriver_detail.py', 'tools/forge_detail.py', 'tools/shrike_smooth.py') }}
      - name: Import and smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import 2>&1 | tee build/import.log
          godot --headless --verbose --path game --quit-after 60 2>&1 | tee build/smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/import.log build/smoke.log; then exit 1; fi
      - name: Capture actual Godot scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture
          test -s build/NeonFoundry-ingame.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --road-closeup
          test -s build/NeonFoundry-road.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --vehicle-view
          test -s build/Kestrel-hovercar.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --vehicle-tail
          test -s build/Kestrel-tail.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --cockpit-view
          test -s build/Kestrel-cockpit.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --door-open
          test -s build/Kestrel-door-open.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --seat-view
          test -s build/Kestrel-driver-seat.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --door-motion-smoke 2>&1 | tee build/door-motion.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/door-motion.log; then exit 1; fi
          grep SCENEFORGE_DOOR_MOTION_OK build/door-motion.log
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --rear-view
          test -s build/NeonFoundry-rear.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --benchmark-smoke 2>&1 | tee build/comparison-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/comparison-smoke.log; then exit 1; fi
          grep SCENEFORGE_COMPARISON build/comparison-smoke.log
      - name: Verify city loop driving and capture
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 120 godot --headless --path game res://city_loop.tscn -- --track-smoke 2>&1 | tee build/city-loop.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/city-loop.log; then exit 1; fi
          grep SCENEFORGE_CITY_LOOP_OK build/city-loop.log
          grep SCENEFORGE_KESTREL_FEEDBACK_OK build/city-loop.log
          grep SCENEFORGE_BOOST_OK build/city-loop.log
          timeout 120 godot --headless --path game --script res://tests/figure8_test.gd 2>&1 | tee build/figure8.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/figure8.log; then exit 1; fi
          grep FIGURE8_RECOVERY_OK build/figure8.log
          timeout 120 godot --headless --path game --script res://tests/circuits_test.gd 2>&1 | tee build/circuits.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/circuits.log; then exit 1; fi
          grep CIRCUITS_OK build/circuits.log
          timeout 120 godot --headless --path game --script res://tests/wall_rebound_test.gd 2>&1 | tee build/wall-rebound.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/wall-rebound.log; then exit 1; fi
          grep WALL_REBOUND_OK build/wall-rebound.log
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture 2>&1 | tee build/loop-track-render.log
          test -s build/NeonLoop-track.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-cockpit --track-action --sound-on 2>&1 | tee build/loop-cockpit-render.log
          test -s build/NeonLoop-cockpit.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-action --sound-on 2>&1 | tee build/loop-action-render.log
          test -s build/NeonLoop-action.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-overview 2>&1 | tee build/loop-overview-render.log
          test -s build/NeonLoop-overview.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-jump 2>&1 | tee build/loop-jump-render.log
          test -s build/NeonCross-jump.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-jump --track-cockpit 2>&1 | tee build/loop-jump-cockpit-render.log
          test -s build/NeonCross-jump-cockpit.png
          for circuit in 1 2; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-overview --circuit-$circuit 2>&1 | tee build/loop-circuit-$circuit-overview-render.log
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-cockpit --track-action --circuit-$circuit 2>&1 | tee build/loop-circuit-$circuit-cockpit-render.log
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-jump --circuit-$circuit 2>&1 | tee build/loop-circuit-$circuit-jump-render.log
          done
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://city_loop.tscn -- --capture --track-menu 2>&1 | tee build/loop-menu-render.log
          for name in Skyway ViperRift; do
            test -s build/$name-overview.png
            test -s build/$name-cockpit.png
            test -s build/$name-jump.png
          done
          test -s build/Circuit-select.png
          if grep -E 'SCRIPT ERROR:|ERROR:' build/loop-*-render.log; then exit 1; fi
      - name: Verify and capture selectable fleet
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 180 godot --headless --path game --script res://tests/fleet_test.gd 2>&1 | tee build/fleet-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/fleet-test.log; then exit 1; fi
          grep FLEET_OK build/fleet-test.log
          timeout 120 godot --headless --path game --script res://tests/foundry_selection_test.gd 2>&1 | tee build/foundry-selection.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/foundry-selection.log; then exit 1; fi
          grep FOUNDRY_FLEET_OK build/foundry-selection.log
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --craft-1 2>&1 | tee build/foundry-pyldriver-render.log
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture --craft-1 --seat-view 2>&1 | tee build/foundry-pyldriver-seat-render.log
          test -s build/Foundry-piledriver.png
          test -s build/Foundry-piledriver-seat.png
          for craft in 0 1 2 3 4 5 6; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://fleet_hangar.tscn -- --capture --craft-$craft 2>&1 | tee build/fleet-$craft-render.log
          done
          for view in tail side top cockpit under; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://fleet_hangar.tscn -- --capture --craft-1 --fleet-$view 2>&1 | tee build/fleet-pyldriver-$view-render.log
            test -s build/Fleet-piledriver-$view.png
          done
          for view in nose side top cockpit; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://fleet_hangar.tscn -- --capture --craft-5 --fleet-$view 2>&1 | tee build/fleet-forge-$view-render.log
            test -s build/Fleet-forge-$view.png
          done
          for view in front rear side top zoomed-rear; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 res://fleet_hangar.tscn -- --capture --craft-6 --fleet-$view 2>&1 | tee build/fleet-synapse-$view-render.log
            test -s build/Fleet-synapse-$view.png
          done
          if grep -E 'SCRIPT ERROR:|ERROR:' build/fleet-*-render.log; then exit 1; fi
          for name in kestrel piledriver shrike mantis aurora forge synapse; do test -s build/Fleet-$name.png; done
      - name: Export and verify APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --export-debug Android ../build/SceneForge-debug.apk 2>&1 | tee build/export.log
          test -s build/SceneForge-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/SceneForge-debug.apk | tee build/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/SceneForge-debug.apk > build/package.txt
          grep "package: name='com.sceneforge.lab.debug'" build/package.txt
          cd build
          sha256sum SceneForge-debug.apk > SHA256SUMS.txt
          printf 'Commit: %s\nRun: %s\nGodot: %s\nSigning: temporary debug\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GODOT_VERSION" > BUILD.txt
      - name: Export permanent signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
          if [ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Godot requires matching store and key passwords."
            exit 1
          fi
          key="$RUNNER_TEMP/sceneforge-release.keystore"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -exportcert -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/signing-cert.der"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("com.sceneforge.lab.debug", "com.sceneforge.lab"))
          PY
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$key"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          godot --headless --path game --export-release Android ../build/SceneForge.apk 2>&1 | tee build/release-export.log
          test -s build/SceneForge.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/SceneForge.apk | tee build/release-signature.txt
          expected=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/release-signature.txt)
          test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/SceneForge.apk > build/release-package.txt
          grep "package: name='com.sceneforge.lab'" build/release-package.txt
          cd build
          sha256sum SceneForge.apk SceneForge-debug.apk > SHA256SUMS.txt
          printf 'Commit: %s\nRun: %s\nGodot: %s\nSigning: permanent release\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GODOT_VERSION" > BUILD.txt
      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SceneForge-Android-${{ github.run_number }}
          path: build/
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SceneForge-Android-${{ github.run_number }}
          path: build
      - name: Update direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view pipeline-latest >/dev/null 2>&1; then
            gh release create pipeline-latest --target "$GITHUB_SHA" --prerelease --title "SceneForge — latest Android test" --notes "Permanently signed Android build. Download SceneForge.apk."
          fi
          gh release upload pipeline-latest build/SceneForge.apk build/SceneForge-debug.apk build/SHA256SUMS.txt build/BUILD.txt build/NeonFoundry-preview.png build/NeonFoundry-ingame.png build/NeonFoundry-road.png build/Kestrel-hovercar.png build/Kestrel-tail.png build/Kestrel-cockpit.png build/Kestrel-door-open.png build/Kestrel-driver-seat.png build/NeonFoundry-rear.png build/asset-report.json build/NeonLoop-track.png build/NeonLoop-cockpit.png build/NeonLoop-action.png build/NeonLoop-overview.png build/NeonCross-jump.png build/NeonCross-jump-cockpit.png build/Skyway-overview.png build/Skyway-cockpit.png build/Skyway-jump.png build/ViperRift-overview.png build/ViperRift-cockpit.png build/ViperRift-jump.png build/Circuit-select.png build/fleet-report.json build/Fleet-kestrel.png build/Fleet-piledriver.png build/Fleet-shrike.png build/Fleet-mantis.png build/Fleet-aurora.png build/Fleet-synapse.png build/Fleet-synapse-front.png build/Fleet-synapse-rear.png build/Fleet-synapse-side.png build/Fleet-synapse-top.png build/Fleet-synapse-zoomed-rear.png build/Fleet-piledriver-tail.png build/Fleet-piledriver-side.png build/Fleet-piledriver-top.png build/Fleet-piledriver-cockpit.png build/Fleet-piledriver-under.png build/Fleet-forge.png build/Fleet-forge-nose.png build/Fleet-forge-side.png build/Fleet-forge-top.png build/Fleet-forge-cockpit.png build/Foundry-piledriver.png build/Foundry-piledriver-seat.png --clobber
          gh release edit pipeline-latest --notes "Successful pipeline build #$GITHUB_RUN_NUMBER from commit $GITHUB_SHA. Permanent release signing verified. Download SceneForge.apk; the debug variant remains available separately."
