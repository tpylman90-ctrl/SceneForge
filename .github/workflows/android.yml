name: Android pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.5.1
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/templates/*.apk "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
      - name: Restore temporary debug identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sceneforge-debug-identity-v1
      - name: Configure export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(Path.home()/".android/debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }.items():
              text += f'{key}="{value}"\n'
          (Path.home()/".config/godot/editor_settings-4.5.tres").write_text(text)
          p = Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("version/code=1", 'version/code='+os.environ["GITHUB_RUN_NUMBER"]))
          PY
      - name: Restore generated scenery
        id: scenery
        uses: actions/cache@v4
        with:
          path: |
            game/assets
            build/NeonFoundry-preview.png
            build/NeonFoundry.blend
            build/asset-report.json
          key: foundry-blender-4.5.3-${{ hashFiles('tools/build_neon_foundry.py') }}
      - name: Build original Blender scenery
        if: steps.scenery.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.3-linux-x64/blender --background --threads 4 --python tools/build_neon_foundry.py
          test -s game/assets/neon_foundry.glb
          test -s build/NeonFoundry-preview.png
      - name: Import and smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import 2>&1 | tee build/import.log
          godot --headless --path game --quit-after 60 2>&1 | tee build/smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/import.log build/smoke.log; then exit 1; fi
      - name: Capture actual Godot scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --capture
          test -s build/NeonFoundry-ingame.png
          timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method gl_compatibility --resolution 1280x720 -- --benchmark-smoke 2>&1 | tee build/comparison-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/comparison-smoke.log; then exit 1; fi
          grep SCENEFORGE_COMPARISON build/comparison-smoke.log
      - name: Export and verify APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --export-debug Android ../build/SceneForge-debug.apk 2>&1 | tee build/export.log
          test -s build/SceneForge-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/SceneForge-debug.apk | tee build/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/SceneForge-debug.apk > build/package.txt
          grep "package: name='com.sceneforge.lab.debug'" build/package.txt
          cd build
          sha256sum SceneForge-debug.apk > SHA256SUMS.txt
          printf 'Commit: %s\nRun: %s\nGodot: %s\nSigning: temporary debug\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GODOT_VERSION" > BUILD.txt
      - name: Export permanent signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
          if [ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Godot requires matching store and key passwords."
            exit 1
          fi
          key="$RUNNER_TEMP/sceneforge-release.keystore"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -exportcert -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/signing-cert.der"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("com.sceneforge.lab.debug", "com.sceneforge.lab"))
          PY
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$key"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          godot --headless --path game --export-release Android ../build/SceneForge.apk 2>&1 | tee build/release-export.log
          test -s build/SceneForge.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/SceneForge.apk | tee build/release-signature.txt
          expected=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/release-signature.txt)
          test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/SceneForge.apk > build/release-package.txt
          grep "package: name='com.sceneforge.lab'" build/release-package.txt
          cd build
          sha256sum SceneForge.apk SceneForge-debug.apk > SHA256SUMS.txt
          printf 'Commit: %s\nRun: %s\nGodot: %s\nSigning: permanent release\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GODOT_VERSION" > BUILD.txt
      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SceneForge-Android-${{ github.run_number }}
          path: build/
          retention-days: 30
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SceneForge-Android-${{ github.run_number }}
          path: build
      - name: Update direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view pipeline-latest >/dev/null 2>&1; then
            gh release create pipeline-latest --target "$GITHUB_SHA" --prerelease --title "SceneForge — latest Android test" --notes "Permanently signed Android build. Download SceneForge.apk."
          fi
          gh release upload pipeline-latest build/SceneForge.apk build/SceneForge-debug.apk build/SHA256SUMS.txt build/BUILD.txt build/NeonFoundry-preview.png build/NeonFoundry-ingame.png build/asset-report.json --clobber
          gh release edit pipeline-latest --notes "Successful pipeline build #$GITHUB_RUN_NUMBER from commit $GITHUB_SHA. Permanent release signing verified. Download SceneForge.apk; the debug variant remains available separately."
