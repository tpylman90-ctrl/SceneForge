name: SceneForge GLB Inspector APK

on:
  push:
    branches: [main]
    paths:
      - 'tools/glb-inspector-android/**'
      - '.github/workflows/glb-inspector-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native Android GLB inspector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable APK
        working-directory: tools/glb-inspector-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SceneForge-GLB-Inspector-APK
          path: tools/glb-inspector-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
