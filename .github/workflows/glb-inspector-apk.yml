name: SceneForge GLB Inspector APK

on:
  push:
    branches: [main]
    paths:
      - 'tools/glb-inspector-android/**'
      - '.github/workflows/glb-inspector-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native Android GLB inspector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 platform (runner-provided SDK)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Configure Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Compile installable APK
        working-directory: tools/glb-inspector-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SceneForge-GLB-Inspector-APK
          path: tools/glb-inspector-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
