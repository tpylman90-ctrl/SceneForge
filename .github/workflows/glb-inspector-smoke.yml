name: SceneForge GLB Inspector startup smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/glb-inspector-smoke.yml'
      - 'tools/glb-inspector-android/**'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK for app compilation
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build APK
        working-directory: tools/glb-inspector-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: |
            adb install -r tools/glb-inspector-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.sceneforge.glbinspector/.MainActivity --ez sceneforge_verify_modes true
            sleep 8
            adb logcat -d -v time > inspector-smoke-logcat.txt
            adb shell pidof com.sceneforge.glbinspector > inspector-pid.txt || true
            echo "App PID: $(cat inspector-pid.txt)"
            grep -n -C 5 -E 'FATAL EXCEPTION|Fatal signal|AndroidRuntime|sceneforge.glbinspector' inspector-smoke-logcat.txt | tail -n 140 || true
            test -s inspector-pid.txt
            grep -q 'SCENEFORGE_MODE_TEST.*ALL_MODES_PASSED' inspector-smoke-logcat.txt
            adb logcat -c
            adb shell am start -W -n com.sceneforge.glbinspector/.CompareActivity --ez sceneforge_verify_compare true
            sleep 7
            adb logcat -d -v time > compare-smoke-logcat.txt
            grep -q 'SCENEFORGE_COMPARE_TEST.*TWO_LIVE_GLB_VIEWERS_PASSED' compare-smoke-logcat.txt
            adb shell pidof com.sceneforge.glbinspector
      - name: Preserve smoke diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GLB-Inspector-Smoke-Logs
          path: |
            inspector-smoke-logcat.txt
            compare-smoke-logcat.txt
            inspector-pid.txt
          if-no-files-found: warn
