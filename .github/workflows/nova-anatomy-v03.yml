name: Nova V03 MPFB realistic anatomy benchmark
on:
  push:
    branches: [experiment/nova-anatomy-v03]
    paths:
      - "tools/nova_anatomy_v03.py"
      - ".github/workflows/nova-anatomy-v03.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-anatomy-v03
  cancel-in-progress: true
jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and official open-source MPFB extension
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri unzip
          curl -fL --retry 4 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          /tmp/blender-4.5.3-linux-x64/blender --command extension build --source-dir /tmp/mpfb2/src/mpfb --output-filepath /tmp/mpfb-extension.zip
          /tmp/blender-4.5.3-linux-x64/blender --command extension install-file -r user_default -e /tmp/mpfb-extension.zip
      - name: Acquire verified MakeHuman CC0 system eyes, skin, eyebrows and hair
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o /tmp/mpfb-system-assets.zip
          echo 'b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  /tmp/mpfb-system-assets.zip' | sha256sum -c -
          mkdir -p /tmp/mpfb-system-assets
          unzip -q /tmp/mpfb-system-assets.zip -d /tmp/mpfb-system-assets
          find /tmp/mpfb-system-assets -iname 'low-poly.mhclo' -o -iname 'young_caucasian_female.mhmat' -o -iname 'long01.mhclo' | head -15
          test "$(find /tmp/mpfb-system-assets -name 'low-poly.mhclo' | wc -l)" -gt 0
      - name: Generate Nova V03 body/face, verify mesh, export GLB and Blender review
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p build/nova-anatomy-v03
          xvfb-run -a /tmp/blender-4.5.3-linux-x64/blender --background --threads 4 --python tools/nova_anatomy_v03.py 2>&1 | tee build/nova-anatomy-v03/blender.log
          grep -q NOVA_V03_REAL_MPFB_ANATOMY_OK build/nova-anatomy-v03/blender.log
          test -s build/nova-anatomy-v03/Nova_V03_Anatomy_Master.blend
          test -s build/nova-anatomy-v03/Nova_V03_Anatomy_Review.glb
          test -s build/nova-anatomy-v03/Nova_V03_face_pbr.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/nova-anatomy-v03/Nova_V03_build_report.json').read_text())
          assert d['body_vertices']>15000,d
          assert d['morph_targets_loaded']>=22,d
          assert len(d['system_assets'])==4,d
          assert 1.70 < d['normalized_height_m'] < 1.76,d
          print('NOVA_V03_REVIEW_ASSETS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nova-V03-Blender-MPFB-character-study
          path: build/nova-anatomy-v03/
          retention-days: 14
      - name: Publish model and inspection images to isolated experiment branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/nova-v03
          cp build/nova-anatomy-v03/Nova_V03_Anatomy_Review.glb experiments/nova-v03/
          cp build/nova-anatomy-v03/Nova_V03_build_report.json experiments/nova-v03/
          cp build/nova-anatomy-v03/Nova_V03_front.png experiments/nova-v03/
          cp build/nova-anatomy-v03/Nova_V03_three_quarter.png experiments/nova-v03/
          cp build/nova-anatomy-v03/Nova_V03_face_pbr.png experiments/nova-v03/
          cp build/nova-anatomy-v03/Nova_V03_full_pbr.png experiments/nova-v03/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/nova-v03/
          git commit -m '[nova-v03] publish verified anatomy GLB and face inspections' || exit 0
          git push origin HEAD:experiment/nova-anatomy-v03
