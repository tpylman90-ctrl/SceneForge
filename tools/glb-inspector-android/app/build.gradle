plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sceneforge.glbinspector'
    compileSdk 37
    defaultConfig {
        applicationId 'com.sceneforge.glbinspector'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.google.android.filament:filament-android:1.77.3'
    implementation 'com.google.android.filament:gltfio-android:1.77.3'
    implementation 'com.google.android.filament:filament-utils-android:1.77.3'
}
